<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>My Skills</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换深色模式" title="切换深色模式">◐</button>

  <main>
    <div class="search-bar">
      <div class="shell search-inner">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.1-5.4a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/></svg>
          <input id="search" type="search" placeholder="搜索标题、标签或 Skill 内容…" autocomplete="off" />
          <kbd>/</kbd>
        </div>
      </div>
    </div>

    <div class="shell">
      <div id="skills-root"></div>
      <section id="empty-state" class="empty-state" hidden>
        <div class="empty-icon">⌕</div>
        <h2>没找到</h2>
        <p>换个关键词再试试。</p>
      </section>
    </div>
  </main>

  <dialog id="skill-dialog" class="skill-dialog">
    <div class="dialog-panel">
      <div class="dialog-head">
        <div>
          <p id="dialog-category" class="dialog-category"></p>
          <h2 id="dialog-title"></h2>
        </div>
        <button id="dialog-close" class="icon-button close-button" type="button" aria-label="关闭">×</button>
      </div>
      <div id="dialog-tags" class="tag-row"></div>
      <pre id="dialog-content" class="full-content"></pre>
    </div>
  </dialog>

  <template id="card-template">
    <article class="skill-card">
      <div class="card-actions">
        <button class="fav-button" type="button" aria-label="收藏">☆</button>
        <button class="copy-button" type="button" aria-label="复制 Skill">复制</button>
      </div>
      <button class="card-open" type="button">
        <h3 class="card-title"></h3>
        <pre class="card-preview"></pre>
      </button>
    </article>
  </template>

  <script src="./skills-data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
